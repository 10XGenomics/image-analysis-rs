[package]
name = "fiducial"
version = "0.1.0"
authors = ["Chaitanya Aluru <chaitanya.aluru@10xgenomics.com>"]
edition = "2018"
license = "LicRef-10XGenomics"
license-file = "../LICENSE.txt"
include = ["src/**/*.rs", "Cargo.toml"]
publish = false

[lib]
name = "fiducial"

[dependencies]
assert_approx_eq = "1"
image = { version = "0.25", default-features = false, features = ["tiff"] }
itertools = ">=0.10,<1"
kd-tree = "0.6"
ndarray = { version = ">=0.16,<0.18", features = ["approx", "blas", "serde-1"] }
ndarray-linalg = "0.17"
ndarray-npy = { version = ">=0.8,<0.10", default-features = false }
ndarray-stats = ">=0.5,<0.7"
rand = "0.8"
slog = "2"
slog-async = "2"
slog-term = "2"

[dev-dependencies]
clap = { version = "4", features = ["derive"] }

[target.'cfg(target_os = "macos")'.dependencies]
accelerate-src = "0.3"

[target.'cfg(not(target_os = "macos"))'.dependencies]
intel-mkl-src = { git = "https://github.com/10XGenomics/intel-mkl-src", branch = "master", features = [
    "mkl-static-lp64-seq",
] }
